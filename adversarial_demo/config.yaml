# Baseline configuration for adversarial attack experiments

# Device configuration
device: "cuda"
seed: 42

# Dataset configuration
dataset: "yfcc" # Options: "yfcc" or "osv"
n_images_to_eval: 100
data_root: "/Data/mathias.ollu/hf_cache/datasets"
data_dirs:
  yfcc: "/Data/mathias.ollu/hf_cache/datasets/YFCC100M/yfcc4k"
  osv: "/Data/mathias.ollu/hf_cache/datasets/osv5m"

# Dataset builder configuration
build_yfcc4k:
  yfcc_dirname: "YFCC100M"
  downloads_dirname: "downloads"
  dataset_dirname: "yfcc4k"
  images_zip_name: "yfcc4k.zip"
  imagedata_txt_name: "0aaaa.r.imagedata.txt"

# Evaluation directories
results_dir: "/users/eleves-b/2023/mathias.ollu/repos/plonk/adversarial_demo/results/results_2405_cosine_sim"
plots_dir: "/users/eleves-b/2023/mathias.ollu/repos/plonk/adversarial_demo/results/results_2405_cosine_sim/plots_2405"

# Parallel processing
parallel_workers: 4
use_cuda_streams: true

model_type: "" # Options: "diffusion", "flow" or "" - i.e. riemannian flow matching

# Pipeline models per dataset
pipelines:
  yfcc: "nicolas-dufour/PLONK_YFCC"
  osv: "nicolas-dufour/PLONK_OSV_5M"

# Attack budgets (epsilon values) per dataset
attack_budgets:
  # yfcc: [0.0157, 0.0314, 0.0628] #4,8,16/255
  yfcc: [0.0157, 0.0314] #4,8,16/255
  osv: [0.0157, 0.0314] #4,8,16/255

# Baseline attack training arguments
attack_train_args:
  yfcc:
    n_steps: 60
    train_batch_size: 256
    lr: 0.001
    anchor_samples: 512
    sampling_steps_salman: 16
    clean_num_steps: 100
    target_pure_noise: false
    dot_product_loss: "cosine_similarity_negative"
    reconstruction_loss_weight: 0.0
    num_restarts: 5
    restart_selection_metric: "final_step_displacement"
    restart_eval_cfg: 10.0
    restart_eval_batch_size: 128
    restart_eval_seed: seed
    restart_eval_num_steps: 250
    # Per-attack-type overrides, merged on top of the above only for the matching
    # attack so every attack type can run in a single evaluation. `ace` is targeted:
    # it pulls the score/encoding towards target_image (l2_target loss, weight alpha).
    per_attack:
      ace:
        dot_product_loss: "l2_target"
        target_image: "/users/eleves-b/2023/mathias.ollu/repos/plonk/.media/MIST.png"
        alpha: 1
  osv:
    n_steps: 60
    train_batch_size: 256
    lr: 0.001
    anchor_samples: 512
    sampling_steps_salman: 16
    clean_num_steps: 100
    target_pure_noise: false
    dot_product_loss: "cosine_similarity_negative"
    reconstruction_loss_weight: 0.0
    num_restarts: 5
    restart_selection_metric: "final_step_displacement"
    restart_eval_cfg: 10.0
    restart_eval_batch_size: 128
    restart_eval_seed: seed
    restart_eval_num_steps: 250
    per_attack:
      ace:
        dot_product_loss: "l2_target"
        target_image: "/users/eleves-b/2023/mathias.ollu/repos/plonk/.media/MIST.png"
        alpha: 1


# Default attack types to evaluate
attack_types: ["encoder", "diffusion", "sampling"]

# Ablation defaults (evaluate-dataset and the standalone ablation commands).
# - max_restarts overrides num_restarts for the run so the always-on restart
#   ablation reaches this depth. Leave null to keep the per-dataset num_restarts.
# - eval_num_steps: sampling-step counts used by the sampling-steps ablation.
max_restarts: 8
eval_num_steps: [8, 16, 32, 64, 128, 250]

# Localizability evaluation options
localizability:
  monte_carlo_samples: 256

# Plotting options
plot:
  gps_true: false
  plot_success_rate: true
  attack_success_rate_thresholds: [200, 750, 2500] # Distance thresholds in km
  stored_metrics: ["final_step_displacement_predicted", "final_step_displacement_true"]
  # Opt-in: re-evaluate each best perturbation across eval_num_steps during
  # evaluate-dataset (extra pipeline runs; no retraining). The restart ablation
  # is always produced (it is free).
  run_sampling_steps_ablation: true
