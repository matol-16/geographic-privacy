device: cuda
seed: 42
dataset: yfcc
n_images_to_eval: 100
data_root: /Data/mathias.ollu/hf_cache/datasets
data_dirs:
  yfcc: /Data/mathias.ollu/hf_cache/datasets/YFCC100M/yfcc4k
  osv: /Data/mathias.ollu/hf_cache/datasets/osv5m
build_yfcc4k:
  yfcc_dirname: YFCC100M
  downloads_dirname: downloads
  dataset_dirname: yfcc4k
  images_zip_name: yfcc4k.zip
  imagedata_txt_name: 0aaaa.r.imagedata.txt
results_dir: /users/eleves-b/2023/mathias.ollu/repos/plonk/adversarial_demo/results/results_2405_cosine_sim
plots_dir: /users/eleves-b/2023/mathias.ollu/repos/plonk/adversarial_demo/results/results_2405_cosine_sim/plots_2405
parallel_workers: 4
use_cuda_streams: true
model_type: ''
pipelines:
  yfcc: nicolas-dufour/PLONK_YFCC
  osv: nicolas-dufour/PLONK_OSV_5M
attack_budgets:
  yfcc:
  - 0.0314
  osv:
  - 0.0157
  - 0.0314
  - 0.0628
attack_train_args:
  yfcc:
    n_steps: 60
    train_batch_size: 256
    lr: 0.001
    anchor_samples: 512
    sampling_steps_salman: 16
    clean_num_steps: 100
    target_pure_noise: false
    dot_product_loss: l2
    reconstruction_loss_weight: 0.0
    num_restarts: 5
    restart_selection_metric: final_step_displacement
    restart_eval_cfg: 10.0
    restart_eval_batch_size: 128
    restart_eval_seed: seed
    restart_eval_num_steps: 250
  osv:
    n_steps: 60
    train_batch_size: 256
    lr: 0.001
    anchor_samples: 512
    sampling_steps_salman: 16
    clean_num_steps: 100
    target_pure_noise: false
    dot_product_loss: cosine_similarity_negative
    reconstruction_loss_weight: 0.0
    num_restarts: 5
    restart_selection_metric: final_step_displacement
    restart_eval_cfg: 10.0
    restart_eval_batch_size: 128
    restart_eval_seed: seed
    restart_eval_num_steps: 250
attack_types:
- encoder
- diffusion
- diffusion_salman
localizability:
  monte_carlo_samples: 256
plot:
  gps_true: false
  plot_success_rate: true
  attack_success_rate_thresholds:
  - 200
  - 750
  - 2500
  stored_metrics:
  - final_step_displacement_predicted
  - final_step_displacement_true
